<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>What We Inherited: a journey through human history</title>
  <style>
/*
 * Palette: verdigris and bone, with a bronze accent (oxidised copper, the metal
 * of the Bronze Age). Type: a book serif for headlines and dates, system sans
 * for reading. No external fonts, so the page works offline.
 */
:root {
  --ink: #0b2527;
  --ink-2: #0f3033;
  --panel: #143c3f;
  --panel-2: #194a4d;
  --line: #2b6064;
  --bone: #eef1ea;
  --mist: #a6c0bb;
  --bronze: #e0ad56;
  --bronze-ink: #2a1c05;
  --right: #8fdcb0;
  --right-bg: rgba(143, 220, 176, 0.12);
  --wrong: #f0a08f;
  --wrong-bg: rgba(240, 160, 143, 0.12);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--ink);
  background-image: radial-gradient(ellipse 80% 50% at 50% -10%, #1d5a5d 0%, rgba(29, 90, 93, 0) 70%);
  background-repeat: no-repeat;
  color: var(--bone);
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
}

.skip {
  position: absolute;
  left: -999px;
  top: 8px;
  background: var(--bone);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: var(--radius);
  z-index: 10;
}
.skip:focus { left: 8px; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Header and progress */
.site-header {
  max-width: 44rem;
  margin: 0 auto;
  padding: 1.25rem 1.25rem 0;
}
.site-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  color: var(--mist);
  letter-spacing: 0.01em;
}
.progress { margin-top: 0.9rem; }
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  color: var(--mist);
  margin-bottom: 0.4rem;
}
.progress-track {
  height: 8px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--bronze);
  border-radius: 999px;
  transition: width 0.45s ease;
}

/* Layout */
.app {
  max-width: 44rem;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 4rem;
  outline: none;
}

h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; }

/* Buttons */
.btn {
  appearance: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font: inherit;
  font-weight: 600;
  padding: 0.85rem 1.6rem;
  cursor: pointer;
  min-height: 48px;
  transition: background-color 0.15s, border-color 0.15s, opacity 0.15s;
}
.btn-primary { background: var(--bronze); color: var(--bronze-ink); }
.btn-primary:hover:not(:disabled) { background: #ecbd70; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-quiet { background: transparent; color: var(--bone); border-color: var(--line); }
.btn-quiet:hover { border-color: var(--mist); }

:focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }

/* Welcome */
.welcome { padding-top: 3.5rem; }
.welcome h1 {
  font-size: clamp(2.6rem, 9vw, 4.4rem);
  line-height: 1.02;
  letter-spacing: -0.015em;
}
.welcome .lead {
  margin: 1.5rem 0 0;
  max-width: 34rem;
  font-family: var(--serif);
  font-size: clamp(1.2rem, 3.6vw, 1.5rem);
  line-height: 1.5;
  color: var(--bone);
}
.welcome .actions { margin-top: 2.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
.welcome .note { margin: 1.5rem 0 0; max-width: 32rem; color: var(--mist); font-size: 0.95rem; }

/* Question */
.era {
  margin: 0.5rem 0 0.25rem;
  font-family: var(--serif);
  font-size: clamp(1.6rem, 5.5vw, 2.2rem);
  color: var(--bronze);
  line-height: 1.15;
}
.question {
  font-size: clamp(1.25rem, 3.8vw, 1.55rem);
  line-height: 1.4;
  margin: 0 0 1.5rem;
  outline: none;
}
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.choices { display: grid; gap: 0.7rem; }

.choice {
  display: grid;
  grid-template-columns: 2.1rem 1fr;
  gap: 0.85rem;
  align-items: start;
  padding: 0.95rem 1rem;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s, background-color 0.15s;
}
.choice:hover { border-color: var(--mist); }
.choice input {
  position: absolute;
  opacity: 0;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.choice .key {
  display: inline-grid;
  place-items: center;
  width: 2.1rem;
  height: 2.1rem;
  border: 1.5px solid var(--mist);
  border-radius: 50%;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--mist);
}
.choice .body { display: block; padding-top: 0.15rem; }
.choice .verdict {
  display: block;
  margin-top: 0.35rem;
  font-size: 0.9rem;
  font-weight: 600;
}

.choice.is-selected { border-color: var(--bronze); background: var(--panel-2); }
.choice.is-selected .key { background: var(--bronze); border-color: var(--bronze); color: var(--bronze-ink); }
.choice input:focus-visible + .key { outline: 3px solid var(--bronze); outline-offset: 3px; }

/* After submitting */
.choices.is-locked .choice { cursor: default; }
.choices.is-locked .choice:hover { border-color: var(--line); }
.choice.is-correct { border-color: var(--right); background: var(--right-bg); }
.choice.is-correct .key { background: var(--right); border-color: var(--right); color: var(--ink); }
.choice.is-correct .verdict { color: var(--right); }
.choice.is-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.choice.is-wrong .key { background: var(--wrong); border-color: var(--wrong); color: var(--ink); }
.choice.is-wrong .verdict { color: var(--wrong); }
.choice.is-dim { opacity: 0.6; }

.actions-row { margin-top: 1.5rem; }
.actions-row .btn { width: 100%; }
@media (min-width: 560px) { .actions-row .btn { width: auto; } }

/* Feedback */
.feedback {
  margin-top: 1.75rem;
  padding: 1.4rem 1.25rem 1.5rem;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  outline: none;
}
.feedback .result { font-size: 1.5rem; margin-bottom: 0.75rem; }
.feedback .result.right { color: var(--right); }
.feedback .result.wrong { color: var(--wrong); }
.feedback h3 { font-size: 1.15rem; margin: 1.25rem 0 0.35rem; color: var(--bronze); }
.feedback p { margin: 0; max-width: 40rem; }
.feedback .explain { margin-bottom: 0.25rem; }

/* Final reveal */
.final { padding-top: 2.5rem; text-align: center; }
.reveal {
  font-size: clamp(2rem, 8.4vw, 3.9rem);
  line-height: 1.12;
  letter-spacing: 0.01em;
  margin: 0 auto;
  max-width: 14em;
  outline: none;
}
.reveal .word { display: inline-block; white-space: nowrap; }
.reveal .ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(0.35em);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.reveal .ch.on { opacity: 1; transform: none; }
.final .after {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  visibility: hidden;
}
.final .after.on { opacity: 1; transform: none; visibility: visible; }
.final .tagline {
  margin: 2.25rem auto 0;
  max-width: 28rem;
  font-family: var(--serif);
  font-size: clamp(1.2rem, 3.8vw, 1.5rem);
  line-height: 1.5;
  color: var(--bronze);
}
.final .cheer {
  margin: 0.75rem 0 0;
  font-family: var(--serif);
  font-size: 1.5rem;
  color: var(--bone);
}
.final .score { margin: 1.25rem 0 0; color: var(--mist); font-size: 0.95rem; }
.final .actions { margin-top: 2rem; }

canvas.confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
}

.noscript { max-width: 44rem; margin: 2rem auto; padding: 0 1.25rem; }

.fallback { padding-top: 3rem; }
.fallback h1 { font-size: 2rem; }
.fallback p { color: var(--mist); }

/* Letter strip and rewards */
.letters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.9rem;
  margin-top: 0.9rem;
}
.letters[hidden] { display: none; }
.tiles { display: inline-flex; gap: 0.25rem; }
.tile {
  display: inline-grid;
  place-items: center;
  width: 1.7rem;
  height: 2rem;
  border-radius: 6px;
  border: 1.5px dashed var(--line);
  font-family: var(--serif);
  font-size: 1.1rem;
  line-height: 1;
  color: var(--bronze-ink);
}
.tile.has { background: var(--bronze); border: 1.5px solid var(--bronze); }
.tile.fresh { animation: tile-pop 0.6s ease-out; }
@keyframes tile-pop { 0% { transform: scale(0.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

@media (max-width: 480px) {
  .letters { gap: 0.3rem 0.6rem; }
  .tiles { gap: 0.15rem; }
  .tile { width: 1.2rem; height: 1.6rem; font-size: 0.9rem; border-radius: 4px; }
}

.try-again {
  margin: 1rem 0 0;
  padding: 0.75rem 1rem;
  border: 1.5px solid var(--wrong);
  border-radius: var(--radius);
  background: var(--wrong-bg);
  color: var(--bone);
  outline: none;
}

.reward {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.9rem 1rem;
  margin-bottom: 1.1rem;
  background: var(--right-bg);
  border: 1.5px solid var(--right);
  border-radius: var(--radius);
}
.reward-tile {
  flex: none;
  display: grid;
  place-items: center;
  width: 3.4rem;
  height: 4rem;
  border-radius: 8px;
  background: var(--bronze);
  color: var(--bronze-ink);
  font-family: var(--serif);
  font-size: 2.2rem;
  animation: tile-pop 0.7s ease-out;
}
.reward-title { margin: 0; font-family: var(--serif); font-size: 1.3rem; color: var(--right); line-height: 1.25; }
.reward-sub { margin: 0.2rem 0 0; font-size: 0.95rem; color: var(--mist); }

/* Illustrations (see js/art.js) */
.art {
  margin: 0.5rem 0 1.25rem;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--panel-2);
}
.art svg { display: block; width: 100%; height: auto; stroke-width: 2; }
.art .fb { fill: var(--bone); }
.art .fz { fill: var(--bronze); }
.art .fm { fill: var(--mist); }
.art .fp { fill: var(--panel); }
.art .fq { fill: var(--panel-2); }
.art .fq2 { fill: #214f52; }
.art .fl { fill: var(--line); }
.art .fg { fill: var(--right); }
.art .fi { fill: var(--ink); }
.art .fr { fill: #e0705c; }
.art .fy { fill: #e8c15a; }
.art .fn { fill: #a8774a; }
.art .ft { fill: #2f7f84; }
.art .fa { fill: #c9a56e; }
.art .fd { fill: #6b4c26; }
.art .fs { fill: #b6c4c1; }
.art .sb, .art .sz, .art .sm, .art .sl, .art .sg, .art .sr, .art .st, .art .sy, .art .sn, .art .sd {
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.art .sb { stroke: var(--bone); }
.art .sz { stroke: var(--bronze); }
.art .sm { stroke: var(--mist); }
.art .sl { stroke: var(--line); }
.art .sg { stroke: var(--right); }
.art .sr { stroke: #e0705c; }
.art .st { stroke: #2f7f84; }
.art .sy { stroke: #e8c15a; }
.art .sn { stroke: #a8774a; }
.art .sd { stroke: #5b4020; }
.art .so { stroke: var(--line); stroke-width: 3; }
.art .tx { font-family: var(--serif); font-weight: 600; }
.art .o2 { opacity: .2; } .art .o3 { opacity: .3; } .art .o4 { opacity: .4; } .art .o5 { opacity: .5; }
.art .o6 { opacity: .6; } .art .o7 { opacity: .7; } .art .o8 { opacity: .8; } .art .o9 { opacity: .9; }

.art .sway, .art .sway2, .art .drift, .art .rise, .art .spin, .art .spin2, .art .pulse { transform-box: fill-box; }
.art .sway { transform-origin: 50% 100%; animation: art-sway 3.6s ease-in-out infinite alternate; }
.art .sway2 { animation: art-bob 2.2s ease-in-out infinite alternate; }
.art .drift { animation: art-drift 7s linear infinite; }
.art .flow { animation: art-flow 2.4s linear infinite; }
.art .rise { transform-origin: center; animation: art-rise 3.6s ease-out infinite; }
.art .spin { transform-origin: center; animation: art-spin 30s linear infinite; }
.art .spin2 { transform-origin: center; animation: art-spin 24s linear infinite reverse; }
.art .pulse { transform-origin: center; animation: art-pulse 2.4s ease-in-out infinite; }
@keyframes art-sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes art-bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes art-drift { from { transform: translateX(0); } to { transform: translateX(-80px); } }
@keyframes art-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
@keyframes art-rise { 0% { transform: translateY(0); opacity: .6; } 100% { transform: translateY(-36px); opacity: 0; } }
@keyframes art-spin { to { transform: rotate(360deg); } }
@keyframes art-pulse { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1.3); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .reveal .ch { opacity: 1; transform: none; }
  .final .after { opacity: 1; transform: none; visibility: visible; }
}

</style>

  <script>
/*
 * Quiz application. No dependencies.
 *
 * How it works:
 *  - Each question has three plain answers.
 *  - A wrong answer is crossed out and the player tries again.
 *  - A correct answer reveals the explanation and earns the next letter of the
 *    secret sentence. Letters collect in a strip at the top of the page.
 *  - After the last question the full sentence is revealed.
 *  - Navigation is forward only: once a question is solved there is no going back.
 *  - Progress is saved in localStorage, so a refresh resumes at the same place.
 */
(function () {
  "use strict";

  var QUESTIONS = window.QUIZ_QUESTIONS || [];
  var SECRET = window.QuizSecret;
  var TOTAL = 23;
  var STORAGE_KEY = "what-we-inherited-progress-v3";
  var LETTERS = ["A", "B", "C"];

  var app = document.getElementById("app");
  var progressBox = document.getElementById("progress");
  var progressText = document.getElementById("progress-text");
  var progressFill = document.getElementById("progress-fill");
  var progressTrack = progressBox.querySelector("[role=progressbar]");
  var lettersBox = document.getElementById("letters");

  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var revealTimer = null;
  var confettiCleanup = null;

  function h(tag, attrs, kids) {

        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, "");
        else el.setAttribute(k, v);

      if (c == null) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);

  /* ---------- Data check (generic message only) ---------- */

  function dataIsValid() {
    try {
      if (!SECRET || QUESTIONS.length !== TOTAL) return false;
      if (SECRET.getLetters().length !== TOTAL) return false;
      for (var i = 0; i < TOTAL; i++) {
        var q = QUESTIONS[i];
        if (!q || !q.options || q.options.length !== 3) return false;
        if (typeof q.correct !== "number" || q.correct < 0 || q.correct > 2) return false;
        for (var k = 0; k < 3; k++) if (!q.options[k].text) return false;

    } catch (e) {
      return false;
    }
  }

  /* ---------- State and persistence ---------- */

  function freshState() {
    var wrong = [];
    for (var i = 0; i < TOTAL; i++) wrong.push([]);
    return { v: 3, phase: "welcome", index: 0, wrong: wrong };
  }

  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return freshState();
      var s = JSON.parse(raw);
      var okPhase = ["welcome", "question", "feedback", "final"].indexOf(s.phase) !== -1;
      var okIndex = typeof s.index === "number" && s.index >= 0 && s.index < TOTAL && Math.floor(s.index) === s.index;
      var okWrong = Array.isArray(s.wrong) && s.wrong.length === TOTAL && s.wrong.every(function (list) {
        return Array.isArray(list) && list.length <= 2 && list.every(function (n, pos) {

  function saveState() {

  }

  }

  }

  function renderLetterStrip(earned) {
    lettersBox.innerHTML = "";
    var message = SECRET.getMessage();
    var k = 0;
    var got = [];
    message.split(" ").forEach(function (word) {

    var submit = h("button", { class: "btn btn-primary", type: "button", id: "submit", text: "Submit answer", disabled: true, onclick: onSubmit });

      var verdict = null;

        else if (isWrong) { cls += " is-wrong"; verdict = "Not this one"; }
        else cls += " is-dim";

            h("p", { class: "reward-title", text: "Correct! You earned the letter " + letter + "." }),
            h("p", { class: "reward-sub", text: tries === 0 ? "First try. Keep your letters: they spell the final surprise." : "Got it after " + (tries + 1) + " tries. Keep your letters: they spell the final surprise." })
          ])
        ]),
        h("p", { class: "explain", text: q.explanation }),
        h("h3", { text: "Why it matters today" }),
        h("p", { text: q.whyItMatters })

  }

  function onSubmit() {

    if (state.phase !== "feedback") return;

    savedProgress = null;
    state = freshState();

      pieces.push({
        x: Math.random() * W,
        y: -Math.random() * H * 0.6,

        vx: (Math.random() - 0.5) * 1.6 * dpr,
        vy: (1.6 + Math.random() * 2.6) * dpr,
        rot: Math.random() * Math.PI * 2,

        color: colors[Math.floor(Math.random() * colors.length)]

    var raf = 0;
    var stopped = false;

    function frame(now) {
      if (stopped) return;
      var t = now - start;
      ctx.clearRect(0, 0, W, H);
      var fade = Math.max(0, 1 - Math.max(0, t - 4200) / 1800);

    raf = requestAnimationFrame(frame);
  }

  /* ---------- Keyboard shortcuts: A-C or 1-3 pick an option ---------- */

  document.addEventListener("keydown", function (e) {
    if (state.phase !== "question" || e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key.toUpperCase();
    var idx = LETTERS.indexOf(key);
    if (idx === -1 && key >= "1" && key <= "3") idx = parseInt(key, 10) - 1;
    if (idx === -1) return;
    var input = document.getElementById("choice-" + idx);
    if (input && !input.disabled) {
      input.checked = true;
      input.dispatchEvent(new Event("change", { bubbles: true }));
      input.focus();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || state.phase !== "question") return;
    var el = document.activeElement;
    if (el && el.tagName === "INPUT" && el.type === "radio") {
      e.preventDefault();
      onSubmit();
    }
  });

  /* ---------- Start ---------- */

  function boot() {
    if (!dataIsValid()) {
      app.appendChild(h("section", { class: "fallback" }, [
        h("h1", { text: "This quiz isn’t ready yet" }),
        h("p", { text: "Something is wrong with the quiz files. Please ask whoever sent it to you for a fresh copy." })
      ]));
      return;
    }
    var loaded = loadState();
    if (loaded.phase === "question" || loaded.phase === "feedback") {
      savedProgress = loaded;
      state = freshState();
    } else if (loaded.phase === "final") {
      state = loaded;
    } else {
      state = freshState();
    }
    render();
  }

  boot();
})();

</script>
</body>
</html>
